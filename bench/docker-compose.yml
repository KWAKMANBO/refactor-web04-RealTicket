# 성능 측정용 실행 환경. 자원 제한을 고정해 측정할 때마다 같은 조건을 만든다.
#   docker compose up -d --build
#   docker compose down -v      # 데이터까지 지우고 처음부터
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: real_ticket
    ports:
      - "3306:3306"
    cpus: 2
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-proot", "--silent"]
      interval: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    cpus: 1
    mem_limit: 512m

  app:
    build: ../back
    environment:
      SPRING_PROFILES_ACTIVE: bench
      DATABASE_HOST: mysql
      REDIS_HOST: redis
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      JAVA_TOOL_OPTIONS: -Xms1g -Xmx1g
    ports:
      - "8080:8080"
    cpus: 2
    mem_limit: 2g
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
