spring:
  application:
    name: realticket
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_SCHEMA:real_ticket}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:root}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jackson:
    time-zone: Asia/Seoul

server:
  port: ${PORT:8080}

springdoc:
  api-docs:
    path: /api-docs-json
  swagger-ui:
    path: /api-docs
    persist-authorization: true

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  front-url: ${FRONT_URL:http://localhost:3000}
  session:
    ttl: 1h
